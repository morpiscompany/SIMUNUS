<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3 'sha256-MmOcF+2OTpniioOCZIq7Mw9Yx7JqG+qq3drV0IuLWpA='; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <script src="./language.js?v=language-1"></script>
    <link rel="stylesheet" href="./css/language.css?v=language-1">
    <title>SIMUNUS — Recuperar senha</title>
    <script src="./recovery-capture.js?v=recovery-1"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/recovery.css?v=mail-1">
</head>
<body class="recovery-page">
    <main class="senha-modal" aria-labelledby="recovery-title">
        <img class="recovery-logo" src="./assets/simunus-logo-light.png" alt="SIMUNUS">
        <h1 id="recovery-title"></h1>
        <p id="recovery-description"></p>
        <form id="recovery-request" novalidate hidden>
            <label for="recovery-email" class="visually-hidden" data-text="email">E-mail cadastrado</label>
            <input id="recovery-email" type="email" autocomplete="email" inputmode="email" placeholder="E-mail cadastrado" required maxlength="254">
            <button class="btn-proxima" type="submit" data-text="send"></button>
        </form>
        <p id="recovery-cooldown-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
        <form id="recovery-password" novalidate hidden>
            <label for="recovery-new" data-text="newPassword"></label>
            <input id="recovery-new" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="recovery-policy">
            <label for="recovery-confirm" data-text="confirm"></label>
            <input id="recovery-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
            <p id="recovery-policy" data-text="policy"></p>
            <button class="btn-proxima" type="submit" data-text="save"></button>
        </form>
        <p id="recovery-feedback" class="senha-modal-feedback" role="status" aria-live="polite"></p>
        <div id="recovery-mail-actions" hidden>
            <a id="recovery-check-mail" class="btn-secundario" target="_blank" rel="noopener noreferrer" data-text="checkMail" hidden></a>
            <button id="recovery-mail-choice" class="btn-secundario" type="button" data-text="checkMail" hidden></button>
            <a id="recovery-browser-mail" class="recovery-mail-text-link" target="_blank" rel="noopener noreferrer" data-text="openBrowser" hidden></a>
            <button id="recovery-other-service" class="recovery-mail-text-link" type="button" data-text="otherService" hidden></button>
            <p class="recovery-mail-hint" data-text="receivedAccount"></p>
            <p class="recovery-mail-hint" data-text="appHint"></p>
            <p class="recovery-mail-hint" data-text="mailHint"></p>
        </div>
        <button id="recovery-retry-cleanup" class="btn-proxima" type="button" data-text="retryCleanup" hidden></button>
        <button id="recovery-another" class="btn-secundario" type="button" data-text="another" hidden></button>
        <div class="recovery-back"><a id="recovery-login" class="btn-secundario" href="./index.html" data-text="login">Voltar</a></div>
        <noscript>Ative o JavaScript para recuperar sua senha.</noscript>
    </main>
    <dialog id="recovery-mail-options" aria-labelledby="recovery-mail-title" aria-describedby="recovery-mail-guide recovery-mail-account recovery-mail-explanation">
        <div class="recovery-mail-dialog-header"><h2 id="recovery-mail-title" data-text="providerTitle"></h2><button id="recovery-mail-close" type="button" data-text="closeMail" autofocus></button></div>
        <p id="recovery-mail-guide" data-text="chooseProvider"></p>
        <div class="recovery-provider-list">
            <div class="recovery-provider-row"><a class="btn-secundario" href="https://mail.google.com/mail/u/0/#inbox" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">✉</span> Gmail</a><a class="recovery-mail-text-link" href="https://mail.google.com/mail/u/0/#inbox" target="_blank" rel="noopener noreferrer" aria-label="Gmail" data-browser-provider="Gmail"><span data-text="openBrowser"></span></a></div>
            <div class="recovery-provider-row"><a class="btn-secundario" href="https://outlook.live.com/mail/0/inbox" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">✉</span> Outlook</a><a class="recovery-mail-text-link" href="https://outlook.live.com/mail/0/inbox" target="_blank" rel="noopener noreferrer" aria-label="Outlook" data-browser-provider="Outlook"><span data-text="openBrowser"></span></a></div>
            <div class="recovery-provider-row"><a class="btn-secundario" href="https://mail.yahoo.com/" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">✉</span> Yahoo Mail</a><a class="recovery-mail-text-link" href="https://mail.yahoo.com/" target="_blank" rel="noopener noreferrer" aria-label="Yahoo Mail" data-browser-provider="Yahoo Mail"><span data-text="openBrowser"></span></a></div>
            <div class="recovery-provider-row"><a class="btn-secundario" href="https://www.icloud.com/mail" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">✉</span> iCloud Mail</a><a class="recovery-mail-text-link" href="https://www.icloud.com/mail" target="_blank" rel="noopener noreferrer" aria-label="iCloud Mail" data-browser-provider="iCloud Mail"><span data-text="openBrowser"></span></a></div>
        </div>
        <p id="recovery-mail-account" data-text="receivedAccount"></p>
        <p id="recovery-mail-explanation" data-text="providerExplanation"></p>
        <p data-text="appHint"></p>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3" integrity="sha384-dl/4LkSyQ4uEucc48NM6VDZLAjLLq9yMzZ5JLXumBq7Ld33XBof73hseOqPhO89+" crossorigin="anonymous"></script>
    <script src="./supabase.js?v=recovery-2"></script>
    <script src="./recovery-config.js?v=recovery-1"></script>
    <script src="./recovery-cooldown.js?v=recovery-3"></script>
    <script src="./recovery.js?v=mail-1"></script>
</body>
</html>
